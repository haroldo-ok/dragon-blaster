; ===========================================================================
;  DRAGON BLASTER - game definition
;
;  Everything about enemies, waves, bosses and stages is described here.
;  Edit, run "make", play. See MODDING.md for the full reference.
; ===========================================================================


; ---------------------------------------------------------------------------
;  Pictures: big images shown on the background layer (bosses, title, story).
;    file        a PNG in data/img
;    frames      animation frames, stacked vertically in the PNG
;    key_frame   the frame kept pixel-perfect (default 0), see below
;    still       use only this frame (for a story page showing a boss)
;
;  A picture is cut into 8x8 tiles; identical (and mirrored) tiles are stored
;  once. Title and story pictures can use 192 different tiles, boss pictures
;  300. When an animation needs more, the other frames reuse tiles that differ
;  by a few pixels from theirs: "make" prints how far it had to go.
; ---------------------------------------------------------------------------

[picture title_logo]
file = title_logo.png

[picture dracolich]
file = dracolich.png
frames = 3
key_frame = 1

[picture dracolich_still]
file = dracolich.png
frames = 3
still = 1

[picture boss_emerald_wyrm]
file = boss_emerald_wyrm.png
frames = 3
key_frame = 1

[picture boss_gazer]
file = boss_gazer.png
frames = 2

[picture boss_frost_hydra]
file = boss_frost_hydra.png
frames = 3
key_frame = 1

[picture boss_reaper]
file = boss_reaper.png
frames = 3
key_frame = 1


; ---------------------------------------------------------------------------
;  Enemies
;    sprite   position of the first frame inside data/img/sprites.png, in
;             pixels; the next frames follow to the right
;    width    16 or 24 pixels (enemies are always 16 pixels tall)
;    frames   animation frames         anim   game frames per animation frame
;    hp       hits to shoot it down    score  points
;    shot     none, down, aimed, aimed3, spread3, spread5, ring, side, cross,
;             weave, spiral, rain
;    fire     frames between two shots
;    flags    ground = part of the scenery, the dragon flies over it
;             tough  = survives ramming the dragon
;    move     path (default): follows its wave's path
;             homing: follows the path for "lock" frames, then hunts the
;             dragon for "chase" frames, then flies straight on
;      speed  top homing speed, pixels per frame (default 2)
;      turn   how quickly it changes course, pixels per frame per frame
;             (default 0.2; low values make wide swoops, high ones tight turns)
; ---------------------------------------------------------------------------

[enemy imp]
sprite = 8 16
width = 24
hp = 1
score = 100

[enemy bat]
sprite = 96 32
frames = 2
anim = 6
hp = 1
score = 100

[enemy wisp]
sprite = 192 32
frames = 2
anim = 6
hp = 2
score = 150
shot = down
fire = 110

[enemy gazer]
