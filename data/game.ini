; ===========================================================================
;  DRAGON BLASTER - game definition
;
;  Everything about enemies, waves, bosses and stages is described here.
;  Edit, run "make", play. See MODDING.md for the full reference.
; ===========================================================================


; ---------------------------------------------------------------------------
;  Pictures: big images shown on the background layer (bosses, title, story).
;  An animated picture stacks its frames vertically in the PNG.
;  At most 192 different 8x8 tiles per picture.
; ---------------------------------------------------------------------------

[picture title_logo]
file = title_logo.png

[picture dracolich]
file = dracolich.png

[picture boss_chieftain]
file = boss_chieftain.png

[picture boss_gazer]
file = boss_gazer.png
frames = 2

[picture boss_frost_wyrm]
file = boss_frost_wyrm.png
frames = 2

[picture boss_inferno_wyrm]
file = boss_inferno_wyrm.png
frames = 2


; ---------------------------------------------------------------------------
;  Enemies
;    sprite   position of the first frame inside data/img/sprites.png, in
;             pixels; the next frames follow to the right
;    width    16 or 24 pixels (enemies are always 16 pixels tall)
;    frames   animation frames         anim   game frames per animation frame
;    hp       hits to shoot it down    score  points
;    shot     none, down, aimed, aimed3, spread3, spread5, ring, side, cross,
;             weave, spiral, rain
;    fire     frames between two shots
;    flags    ground = part of the scenery, the dragon flies over it
;             tough  = survives ramming the dragon
; ---------------------------------------------------------------------------

[enemy imp]
sprite = 8 16
width = 24
hp = 1
score = 100

[enemy bat]
sprite = 96 32
frames = 2
anim = 6
hp = 1
score = 100

[enemy wisp]
sprite = 192 32
frames = 2
anim = 6
hp = 2
score = 150
shot = down
fire = 110

[enemy gazer]
sprite = 128 32
frames = 2
anim = 24
hp = 4
score = 250
shot = aimed
fire = 70

[enemy skull]
sprite = 160 32
frames = 2
anim = 12
hp = 3
score = 200
shot = side
fire = 90

[enemy fire_drake]
sprite = 32 16
width = 24
frames = 2
anim = 6
hp = 6
score = 400
shot = spread3
fire = 80

[enemy frost_drake]
sprite = 0 32
width = 24
frames = 2
anim = 6
hp = 6
score = 400
shot = aimed3
fire = 90

[enemy bone_drake]
sprite = 48 32
width = 24
frames = 2
anim = 6
hp = 10
score = 600
shot = ring
fire = 100
flags = tough

[enemy tower]
sprite = 224 32
frames = 2
anim = 16
hp = 6
score = 300
shot = aimed
fire = 80
flags = ground


