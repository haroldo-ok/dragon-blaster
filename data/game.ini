; ---------------------------------------------------------------------------
;  Bosses
;    picture      one of the pictures above
;    hp           hit points          rage_hp   below this, the boss enrages
;    hitbox       x y width height, in pixels inside the picture
;    muzzle       x y of the point the attacks come from
;    move         wander, sweep (side to side) or chase (follows the dragon)
;    speed        pixels per frame    rage_speed   same, when enraged
;    anim         game frames per animation frame
;    attacks      list of "pattern delay duration": fire <pattern> every
;                 <delay> frames for <duration> frames, then go to the next
;                 one. Patterns are the same as the enemy shots.
;    rage_attacks the list used when enraged
;    score        points for defeating it
; ---------------------------------------------------------------------------

[boss chieftain]
name = IMP CHIEFTAIN
picture = boss_chieftain
hp = 220
rage_hp = 80
hitbox = 10 6 44 46
muzzle = 30 44
move = wander
speed = 1
rage_speed = 2
attacks = aimed 36 240, spread3 48 240, side 30 160
rage_attacks = aimed3 44 240, spread5 54 240, side 22 160
score = 3000

[boss gazer]
name = THE GAZER
picture = boss_gazer
hp = 320
rage_hp = 120
hitbox = 14 6 52 52
muzzle = 40 36
move = chase
speed = 1
rage_speed = 2
anim = 45
attacks = ring 56 300, aimed 26 240, spiral 7 280
rage_attacks = ring 40 300, aimed3 38 240, spiral 5 300
score = 5000

[boss frost_wyrm]
name = FROST WYRM
picture = boss_frost_wyrm
hp = 400
rage_hp = 150
hitbox = 16 4 64 50
muzzle = 48 58
move = sweep
speed = 2
rage_speed = 3
anim = 12
attacks = down 14 240, spread5 46 280, rain 9 280
rage_attacks = spread5 34 280, rain 6 300, aimed3 32 240
score = 6000

[boss inferno_wyrm]
name = INFERNO WYRM
picture = boss_inferno_wyrm
hp = 480
rage_hp = 180
hitbox = 16 4 64 50
muzzle = 48 58
move = chase
speed = 2
rage_speed = 2
anim = 12
attacks = weave 16 300, side 22 200, aimed3 38 280
rage_attacks = weave 11 300, ring 42 280, spread5 32 280
score = 8000

[boss dracolich]
name = DRACOLICH
picture = dracolich
hp = 700
rage_hp = 300
hitbox = 24 8 48 92
muzzle = 48 36
move = wander
speed = 1
rage_speed = 2
attacks = aimed3 42 300, ring 48 300, weave 15 300, spiral 6 320
rage_attacks = spiral 4 320, ring 32 300, rain 5 300, aimed3 30 300, cross 22 200
score = 20000


; ---------------------------------------------------------------------------
;  Stages, played in order. The last boss defeated leads to the ending.
;    tileset     data/img/tileset_<name>.png
;    map         data/map/<name>.tmx
;    music       data/music/<name>.mml      boss_music   (default: boss)
;    sky         background colour of the boss fight: red green blue, 0..3
;    scroll      scrolling speed, pixels per frame
;    bonus       points awarded for clearing the stage
; ---------------------------------------------------------------------------

[stage 1]
name = EMERALD PLAINS
tileset = plains
map = level1
music = stage1
boss = chieftain
sky = 0 0 1
bonus = 1000

[stage 2]
name = SCORCHED DUNES
tileset = desert
map = level2
music = stage2
boss = gazer
sky = 1 0 1
bonus = 2000

[stage 3]
name = FROZEN PEAKS
tileset = frozen
map = level3
music = stage3
boss = frost_wyrm
sky = 0 0 1
bonus = 3000

[stage 4]
name = FALLEN FORTRESS
tileset = fortress
map = level4
music = stage4
boss = inferno_wyrm
sky = 1 0 0
bonus = 4000

[stage 5]
name = LAIR OF THE LICH
tileset = lair
map = level5
music = stage5
boss = dracolich
boss_music = final_boss
sky = 0 0 0
bonus = 10000
